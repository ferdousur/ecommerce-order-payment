<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce App (Perfect Flow)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">E-Commerce App</a>
            <div class="d-flex align-items-center">
                <span id="userInfo" class="navbar-text text-white me-3 fw-bold"></span>
                <button class="btn btn-light btn-sm me-2" onclick="showSection('products')">Products</button>
                <button class="btn btn-light btn-sm me-2" onclick="showSection('cart')">Cart</button>
                <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Auth Section -->
        <div id="authSection" class="row justify-content-center">
            <div class="col-md-5">
                <div class="card p-4 shadow-sm">
                    <ul class="nav nav-tabs mb-3" id="authTabs">
                        <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#login">Login</a></li>
                        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#register">Register</a></li>
                    </ul>
                    <div class="tab-content">
                        <div class="tab-pane fade show active" id="login">
                            <form id="loginForm">
                                <div class="mb-3"><label>Username</label><input type="text" id="loginUser" class="form-control" required></div>
                                <div class="mb-3"><label>Password</label><input type="password" id="loginPass" class="form-control" required></div>
                                <button type="submit" class="btn btn-primary w-100">Login</button>
                            </form>
                        </div>
                        <div class="tab-pane fade" id="register">
                            <form id="registerForm">
                                <div class="row">
                                    <div class="col-6 mb-3"><input type="text" id="regFirst" class="form-control" placeholder="First Name" required></div>
                                    <div class="col-6 mb-3"><input type="text" id="regLast" class="form-control" placeholder="Last Name" required></div>
                                </div>
                                <div class="mb-3"><input type="text" id="regUser" class="form-control" placeholder="Username" required></div>
                                <div class="mb-3"><input type="email" id="regEmail" class="form-control" placeholder="Email" required></div>
                                <div class="mb-3"><input type="password" id="regPass" class="form-control" placeholder="Password" required></div>
                                <button type="submit" class="btn btn-success w-100">Register</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Products Section -->
        <div id="productsSection" class="d-none">
            <h3 class="mb-3">Products</h3>
            <button class="btn btn-outline-primary mb-3" onclick="loadProducts()">Refresh Products</button>
            <div id="productsList" class="row"></div>
        </div>

        <!-- Cart Section -->
        <div id="cartSection" class="d-none">
            <h3 class="mb-3">My Cart</h3>
            <button class="btn btn-outline-primary mb-3" onclick="loadCart()">Refresh Cart</button>
            <div id="cartList" class="list-group mb-3"></div>
            <button class="btn btn-warning w-100 py-2 fw-bold" data-bs-toggle="modal" data-bs-target="#checkoutModal" id="btnCheckout" disabled>
                Proceed to Checkout
            </button>
        </div>
    </div>

    <!-- Checkout Modal -->
    <div class="modal fade" id="checkoutModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Checkout Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="checkoutForm">
                        <div class="mb-3">
                            <label class="form-label">Shipping Address</label>
                            <textarea id="shippingAddress" class="form-control" rows="3" required placeholder="Enter your full address"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Payment Method</label>
                            <select id="paymentProvider" class="form-select" required>
                                <option value="0">Stripe (0)</option>
                                <option value="1">bKash (1)</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-success" onclick="processCheckout()">Confirm & Pay</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
