name: CI/CD Pipeline - Test & Deploy to Azure

on:
  push:
    branches: [ "main" ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Run Unit Tests
      run: dotnet test --configuration Release --no-restore

    # 1. Automatically generate fresh SSH keys and copy to server using SSHpass
    - name: Setup Auto SSH Key & Authorize Server
      env:
        SSH_PASSWORD: ${{ secrets.AZURE_VM_PASSWORD }}
        VM_HOST: ${{ secrets.AZURE_VM_HOST }}
        VM_USER: ${{ secrets.AZURE_VM_USERNAME }}
      run: |
        sudo apt-get install -y sshpass
        ssh-keygen -t rsa -b 4096 -f ~/.ssh/id_rsa -N ""
        ssh-keyscan -H $VM_HOST >> ~/.ssh/known_hosts
        
        # Automatically send public key to server using password
        sshpass -p "$SSH_PASSWORD" ssh-copy-id -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa.pub $VM_USER@$VM_HOST

    # 2. Copy files to Azure VM using secure SCP
    - name: Copy files to Azure VM
      run: |
        scp -i ~/.ssh/id_rsa -r . ${{ secrets.AZURE_VM_USERNAME }}@${{ secrets.AZURE_VM_HOST }}:~/app/ecommerce-order-payment

    # 3. Run Docker Compose on Azure VM via SSH
    - name: Run Docker Compose on Azure VM
      run: |
        ssh -i ~/.ssh/id_rsa ${{ secrets.AZURE_VM_USERNAME }}@${{ secrets.AZURE_VM_HOST }} << 'EOF'
          cd ~/app/ecommerce-order-payment
          sudo docker-compose up --build -d --no-deps backend
          sudo docker system prune -f
        EOF