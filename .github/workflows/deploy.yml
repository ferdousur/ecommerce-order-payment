name: CI/CD Pipeline - Test & Deploy to Azure

on:
  push:
    branches: [ "main" ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Run Unit Tests
      run: dotnet test --configuration Release --no-restore

   # 1. Clean Sync using rsync with automatic SSH Key setup
    - name: Deploy via Rsync
      env:
        SSH_PASSWORD: ${{ secrets.AZURE_VM_PASSWORD }}
        VM_HOST: ${{ secrets.AZURE_VM_HOST }}
        VM_USER: ${{ secrets.AZURE_VM_USERNAME }}
      run: |
        sudo apt-get install -y sshpass rsync
        mkdir -p ~/.ssh
        ssh-keyscan -H $VM_HOST >> ~/.ssh/known_hosts
        
        # Generate key and push to server without prompting
        ssh-keygen -t rsa -b 2048 -f ~/.ssh/id_rsa -N ""
        sshpass -p "$SSH_PASSWORD" ssh-copy-id -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa.pub $VM_USER@$VM_HOST
        
        # Create directory without sudo since the user owns their home directory
        ssh -i ~/.ssh/id_rsa $VM_USER@$VM_HOST "mkdir -p ~/app/ecommerce-order-payment"
        
        # Rsync project files (excluding heavy/useless folders)
        rsync -avz -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
          --exclude '.git/' \
          --exclude 'bin/' \
          --exclude 'obj/' \
          --exclude '.vs/' \
          . $VM_USER@$VM_HOST:~/app/ecommerce-order-payment/

    # 2. Run Docker Compose on Remote Server
    - name: Run Docker Compose
      env:
        VM_HOST: ${{ secrets.AZURE_VM_HOST }}
        VM_USER: ${{ secrets.AZURE_VM_USERNAME }}
      run: |
        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no $VM_USER@$VM_HOST << 'EOF'
          cd ~/app/ecommerce-order-payment
          docker-compose up --build -d --no-deps backend
          docker system prune -f
        EOF