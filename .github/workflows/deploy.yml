name: CI/CD Pipeline - Test & Deploy to Azure

on:
  push:
    branches: [ "main" ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Run Unit Tests
      run: dotnet test --configuration Release --no-restore

    # 1. Setup SSH Key cleanly from Base64 Secret
    - name: Setup SSH Key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.AZURE_VM_SSH_KEY }}" | base64 -d | tr -d '\r' > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.AZURE_VM_HOST }} >> ~/.ssh/known_hosts

    # 2. Copy files to Azure VM using standard secure SCP
    - name: Copy files to Azure VM
      run: |
        scp -i ~/.ssh/id_rsa -r . ${{ secrets.AZURE_VM_USERNAME }}@${{ secrets.AZURE_VM_HOST }}:~/app/ecommerce-order-payment

    # 3. Run Docker Compose on Azure VM via standard SSH
    - name: Run Docker Compose on Azure VM
      run: |
        ssh -i ~/.ssh/id_rsa ${{ secrets.AZURE_VM_USERNAME }}@${{ secrets.AZURE_VM_HOST }} << 'EOF'
          cd ~/app/ecommerce-order-payment
          sudo docker-compose up --build -d --no-deps backend
          sudo docker system prune -f
        EOF